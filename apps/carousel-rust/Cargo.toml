[package]
name = "carousel-rust"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
description = "PocketCHIP Rust media carousel with the shared Vitrallis photo library"
license = "MIT"
repository = "https://github.com/csd113/Vitrallis-Apps"
readme = "README.md"
keywords = ["vitrallis", "pocketchip", "carousel", "media"]
categories = ["multimedia::images", "multimedia::video"]
publish = false
autotests = false

[dependencies]
anyhow = "1"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
unicode_categories = "0.1"
zip = { version = "6", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
