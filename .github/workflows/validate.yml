name: Validate catalog and packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VITRALLIS_REQUIRE_GUI: '1'
      VITRALLIS_REQUIRE_EGL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch external Places package source
        run: git clone https://github.com/csd113/Places.git "$RUNNER_TEMP/places"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Determine runtime scope
        id: scope
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          base = os.environ.get('TEST_BASE', '')
          if not base or base == '0' * 40:
              base = subprocess.check_output(['git', 'hash-object', '-w', '-t', 'tree', '/dev/null'], text=True).strip()
          result = subprocess.check_output([sys.executable, 'tools/scoped_tests.py', '--base', base], text=True)
          selected = json.loads(result)['runtime_packages']
          print(result, end='')
          (Path(os.environ['RUNNER_TEMP']) / 'runtime-scope.json').write_text(json.dumps(selected))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('runtime=' + ('true' if selected else 'false') + '\n')
          PY
      - name: Install verification runtime prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg libegl1 libgles2 libgl1-mesa-dri libsdl2-dev
      - name: Install staged-workflow dependencies
        run: python -m pip install -r apps/music/requirements.txt -r apps/sketch/requirements.txt
      - name: Install affected Python dependencies
        if: steps.scope.outputs.runtime == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          for package in json.loads((Path(os.environ['RUNNER_TEMP']) / 'runtime-scope.json').read_text()):
              requirements = Path(package) / 'requirements.txt'
              if requirements.is_file():
                  subprocess.run([sys.executable, '-m', 'pip', 'install', '-r', str(requirements)], check=True)
          PY
      - name: Validate schema, catalog, pinned hashes and example manifest
        run: |
          python tools/validate_catalog.py --source-repo csd113/Places="$RUNNER_TEMP/places" --catalog apps.json --package examples/hello-vitrallis
          python tools/validate_catalog.py --package examples/hello-rust
      - name: Validate every package without launching applications
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tools')
          from catalog_lib import match, SOURCE_PATH
          root = Path('apps')
          if root.exists() or root.is_symlink():
              if root.is_symlink() or not root.is_dir():
                  sys.exit('apps: expected a regular directory')
              for package in sorted(root.iterdir()):
                  match(package.as_posix(), SOURCE_PATH, package)
                  subprocess.run([sys.executable, 'tools/validate_catalog.py', '--package', str(package)], check=True)
          PY
      - name: Tooling regression tests (staged GUI required)
        run: xvfb-run -a python -m unittest discover -s tools/tests -v
      - name: Test affected applications (GUI required)
        if: steps.scope.outputs.runtime == 'true'
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          command = [sys.executable, 'tools/scoped_tests.py', '--run']
          for package in json.loads((Path(os.environ['RUNNER_TEMP']) / 'runtime-scope.json').read_text()):
              command.extend(['--app', package])
          subprocess.run(command, check=True)
          PY
      - name: Compile Python outside packages
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/vitrallis-pycache
        run: |
          python -m compileall -q tools examples
          if [ -d apps ]; then python -m compileall -q apps; fi
      - name: Whitespace checks
        run: git diff --check
