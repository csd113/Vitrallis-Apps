name: Validate catalog and packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VITRALLIS_REQUIRE_GUI: '1'
      VITRALLIS_REQUIRE_EGL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop test prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg libegl1 libgles2 libgl1-mesa-dri libsdl2-dev
      - name: Install Media Carousel Python dependency
        run: python -m pip install -r apps/vitrallis-media-carousel/requirements.txt
      - name: Validate schema, catalog, pinned hashes and example manifest
        run: |
          python tools/validate_catalog.py --catalog apps.json --package examples/hello-vitrallis
          python tools/validate_catalog.py --package examples/hello-rust
      - name: Diagnose bounded FFmpeg runtime
        run: |
          python - <<'PYCODE'
          import os, resource, subprocess
          for limit in (256, 384, 512):
              def bound():
                  resource.setrlimit(resource.RLIMIT_AS, (limit * 1024 * 1024, limit * 1024 * 1024))
              with open('apps/carousel-rust/assets/capability-vp8.webm', 'rb') as media:
                  result = subprocess.run(['ffprobe', '-v', 'error', '-threads', '1', '-protocol_whitelist', 'file,pipe', '-show_streams', '-show_format', '-of', 'json', 'pipe:0'], stdin=media, capture_output=True, timeout=15, preexec_fn=bound, env=dict(os.environ, OPENBLAS_NUM_THREADS='1', OMP_NUM_THREADS='1'))
              print('FFprobe memory MiB:', limit, 'exit:', result.returncode, 'stderr:', result.stderr.decode(errors='replace')[:4000])
          PYCODE
      - name: Native Rust application validation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/carousel-rust-target
        run: |
          cargo fmt --manifest-path apps/carousel-rust/Cargo.toml --all --check
          cargo clippy --manifest-path apps/carousel-rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery -D clippy::cargo
          cargo test --manifest-path apps/carousel-rust/Cargo.toml --workspace --all-features
          cargo build --locked --release --manifest-path apps/carousel-rust/Cargo.toml
          CAROUSEL_RUST_TEST_BINARY="$CARGO_TARGET_DIR/release/carousel-rust" cargo test --manifest-path apps/carousel-rust/Cargo.toml --workspace --all-features -- --include-ignored
          CAROUSEL_RUST_TEST_BINARY="$CARGO_TARGET_DIR/release/carousel-rust" python -m unittest discover -s apps/carousel-rust/tests -v
          test_home=$(mktemp -d)
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/config" XDG_DATA_HOME="$test_home/data" XDG_CACHE_HOME="$test_home/cache" \
            xvfb-run -a "$CARGO_TARGET_DIR/release/carousel-rust" --software-dev --smoke-seconds 3
      - name: Validate and test every native package (GUI required)
        run: |
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tools')
          from catalog_lib import match, SOURCE_PATH
          root = Path('apps')
          if root.exists() or root.is_symlink():
              if root.is_symlink() or not root.is_dir():
                  sys.exit('apps: expected a regular directory')
              for package in sorted(root.iterdir()):
                  match(package.as_posix(), SOURCE_PATH, package)
                  subprocess.run([sys.executable, 'tools/validate_catalog.py', '--package', str(package)], check=True)
                  subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', str(package / 'tests'), '-v'], check=True)
          PY
      - name: Tooling regression tests
        run: python -m unittest discover -s tools/tests -v
      - name: Example desktop tests (GUI required)
        run: xvfb-run -a python -m unittest discover -s examples/hello-vitrallis/tests -v
      - name: Experimental Rust example and packaging
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vitrallis-rust-target
        run: |
          python -m unittest discover -s examples/hello-rust/tests -v
          cargo fmt --manifest-path examples/hello-rust/Cargo.toml --all --check
          cargo clippy --manifest-path examples/hello-rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery -D clippy::cargo
          cargo test --manifest-path examples/hello-rust/Cargo.toml --workspace --all-features
          python tools/build_rust_app.py --source examples/hello-rust --output "${{ runner.temp }}/hello-rust-package" --target x86_64-unknown-linux-gnu
          python "${{ runner.temp }}/hello-rust-package/main.py"
      - name: Compile Python outside packages
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/vitrallis-pycache
        run: |
          python -m compileall -q tools examples
          if [ -d apps ]; then python -m compileall -q apps; fi
      - name: Whitespace checks
        run: git diff --check
